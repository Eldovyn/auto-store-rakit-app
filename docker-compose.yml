version: '3.8'

services:
  bot:
    build: .
    container_name: auto_store_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
    volumes:
      - .:/app


  mongodb:
    image: mongo:latest
    container_name: auto_store_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
